<!--
  ZRHS2026 Galactic Greenhouse Visualizer
  ========================================
  cd ~/Documents/GitHub/ZR_visualizations
  python3 -m http.server 8000
  open http://localhost:8000/ZRHS2026/galactic_garden_viz.html

  Load a simulation .txt file to replay the match.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Galactic Greenhouse - ZRHS2026 Visualizer</title>
  <style>
    :root {
      --bg-deep: #060612;
      --bg-panel: rgba(8, 12, 28, 0.88);
      --bg-card: rgba(15, 22, 45, 0.75);
      --border: rgba(80, 120, 200, 0.2);
      --accent-green: #00ff88;
      --accent-cyan: #00ccff;
      --accent-gold: #ffd700;
      --accent-red: #ff4466;
      --accent-blue: #4488ff;
      --text: #d0d8f0;
      --text-dim: rgba(180, 195, 230, 0.55);
      --font: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%;
      font-family: var(--font);
      background: var(--bg-deep);
      color: var(--text);
      overflow: hidden;
    }

    /* === LAYOUT === */
    #layout {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* === CODE PANELS === */
    #code, #blueCode {
      width: 18%;
      padding: 16px 12px;
      max-height: 100vh;
      overflow: hidden;
      background: var(--bg-panel);
      scrollbar-width: thin;
      scrollbar-color: rgba(100,140,255,0.3) transparent;
      display: flex;
      flex-direction: column;
    }
    #code {
      border-right: 1px solid var(--border);
    }
    #blueCode {
      border-left: 1px solid var(--border);
    }
    .code-header {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 6px 8px 10px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .code-header.red { color: var(--accent-red); }
    .code-header.blue { color: var(--accent-blue); }
    #code pre, #blueCode pre {
      margin: 0;
      padding: 4px 8px;
      font-size: 11px;
      opacity: 0.4;
      transition: all 0.3s ease;
      border-radius: 3px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #code .highlight, #blueCode .highlight {
      background: rgba(0, 255, 136, 0.12);
      color: var(--accent-green);
      opacity: 1.0;
      border-left: 2px solid var(--accent-green);
    }

    /* === SIM PANEL === */
    #sim {
      flex: 1 1 0;
      min-width: 0;
      position: relative;
      background: var(--bg-deep);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    canvas { flex: 1 1 0; min-height: 0; display: block; }

    /* === CONTROLS === */
    #controls {
      padding: 8px 16px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 30;
    }
    #controls button {
      background: rgba(30, 45, 80, 0.8);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-family: var(--font);
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      white-space: nowrap;
    }
    #controls button:hover {
      background: rgba(50, 75, 130, 0.9);
      border-color: var(--accent-cyan);
      color: white;
    }
    #controls button.active {
      background: rgba(0, 200, 255, 0.2);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }
    #btnRecord.recording {
      background: rgba(255, 50, 50, 0.3);
      border-color: #ff4444;
      color: #ff4444;
      animation: rec-pulse 1s infinite;
    }
    @keyframes rec-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    #controls select {
      background: rgba(30, 45, 80, 0.8);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 8px;
      font-family: var(--font);
      font-size: 12px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    /* === OVERLAY UI === */
    .overlay-panel {
      position: absolute;
      z-index: 20;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 12px;
      pointer-events: none;
    }

    #gameTitle {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      letter-spacing: 4px;
      color: rgba(200, 215, 255, 0.8);
      z-index: 20;
      pointer-events: none;
      text-shadow: 0 0 12px rgba(100, 140, 255, 0.4);
    }
    #gameTimer {
      position: absolute;
      top: 14px;
      right: 16px;
      z-index: 20;
      background: rgba(8, 14, 32, 0.9);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 20px;
      font-weight: bold;
      color: white;
    }

    /* Score panels */
    .score-panel {
      position: absolute;
      bottom: 98px;
      z-index: 20;
      background: rgba(8, 14, 32, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      min-width: 200px;
    }
    #redScorePanel { left: 12px; }
    #blueScorePanel { right: 12px; }
    .score-panel h3 {
      font-size: 16px;
      letter-spacing: 2px;
      margin-bottom: 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }
    .score-panel.red h3 { color: var(--accent-red); }
    .score-panel.blue h3 { color: var(--accent-blue); }
    .score-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      color: var(--text-dim);
      gap: 12px;
    }
    .score-row span { color: var(--text); font-weight: bold; }
    .score-total {
      display: flex;
      justify-content: space-between;
      padding-top: 6px;
      margin-top: 5px;
      border-top: 1px solid var(--border);
      font-weight: bold;
      font-size: 18px;
    }
    .score-total.red span { color: var(--accent-red); }
    .score-total.blue span { color: var(--accent-blue); }

    /* Bonus crop display */
    #bonusCropDisplay {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      background: rgba(255, 215, 0, 0.2);
      backdrop-filter: blur(14px);
      border: 2px solid rgba(255, 215, 0, 0.5);
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: bold;
      color: var(--accent-gold);
      display: none;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
    }

    /* Winner message */
    #gameWinnerMessage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      border: 2px solid var(--accent-green);
      padding: 28px 50px;
      border-radius: 14px;
      font-size: 32px;
      color: var(--accent-green);
      display: none;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 0 80px rgba(0, 255, 136, 0.3);
      text-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
    }

    /* Bonus harvest message */
    .bonus-message {
      position: absolute;
      top: 130px;
      z-index: 22;
      background: rgba(255, 215, 0, 0.18);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-gold);
      display: none;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
    }
    #redBonusMessage { left: 16px; }
    #blueBonusMessage { right: 16px; }

    /* Action message */
    #actionMessage {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 22;
      background: rgba(8, 14, 32, 0.9);
      backdrop-filter: blur(10px);
      padding: 8px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 16px;
      color: var(--text);
      display: none;
      pointer-events: none;
      white-space: nowrap;
    }

    /* Resource indicators */
    #redResourcePanel {
      position: absolute;
      top: 48px;
      left: 16px;
      z-index: 20;
    }
    #blueResourcePanel {
      position: absolute;
      top: 48px;
      right: 16px;
      z-index: 20;
    }
    .resource-badge {
      background: rgba(8, 14, 32, 0.9);
      backdrop-filter: blur(8px);
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 15px;
    }
    .resource-badge .label { color: var(--text-dim); }
    .resource-badge .value { color: var(--accent-cyan); font-weight: bold; }
    .resource-badge .value.gold { color: var(--accent-gold); }
    .resource-badge .value.red-val { color: var(--accent-red); }
    .resource-badge .value.blue-val { color: var(--accent-blue); }

    /* Crop legend */
    #cropLegend {
      position: absolute;
      bottom: 54px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(8, 14, 32, 0.9);
      backdrop-filter: blur(8px);
      padding: 8px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 13px;
      display: flex;
      gap: 16px;
      white-space: nowrap;
      pointer-events: none;
    }
    .crop-item { color: var(--text); }
    .crop-item .emoji { font-size: 15px; }

    /* Sprinkler/Tractor status */
    .status-indicator {
      position: absolute;
      z-index: 20;
      background: var(--bg-card);
      backdrop-filter: blur(8px);
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 10px;
      display: none;
    }
    #sprinklerStatus { bottom: 160px; left: 12px; }
    #tractorStatus { bottom: 160px; right: 12px; }

    /* Event log styling */
    .event-log {
      padding: 4px 0;
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .log-entry {
      padding: 4px 8px;
      font-size: 13px;
      opacity: 0.7;
      border-radius: 3px;
      margin: 2px 0;
      line-height: 1.6;
      word-break: break-word;
    }
    .log-entry.plant { color: #44ff88; opacity: 1; }
    .log-entry.water { color: #44ccff; opacity: 1; }
    .log-entry.harvest { color: #ffd700; opacity: 1; }
    .log-entry.astronaut { color: #ffd700; opacity: 1; font-weight: bold; }
    .log-entry.fill { color: #44ccff; opacity: 0.9; }
    .log-entry.explore { color: #88ff88; opacity: 1; }
    .log-entry.move { color: #aabbcc; opacity: 0.6; }
    .log-entry.info { color: #bbaadd; opacity: 0.85; }
    .log-entry .log-time {
      color: var(--text-dim);
      margin-right: 6px;
      font-size: 11px;
    }
    .log-entry.newest {
      background: rgba(0, 255, 136, 0.08);
      border-left: 2px solid var(--accent-green);
      opacity: 1;
    }

    /* Timeline slider */
    #timeline {
      flex: 1 1 0;
      min-width: 80px;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(80, 120, 200, 0.3);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      margin: 0 4px;
    }
    #timeline::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent-cyan);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 204, 255, 0.5);
    }
    #timeline::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 3px;
    }
    #timeDisplay {
      font-size: 12px;
      color: var(--text);
      min-width: 95px;
      text-align: right;
      white-space: nowrap;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 8px rgba(0, 255, 136, 0.2); }
      50% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
    }
  </style>
</head>
<body>
  <!-- Main Layout -->
  <div id="layout">
    <!-- Red Event Log Panel -->
    <div id="code">
      <div class="code-header red" id="redCodeHeader">RED ROBOT</div>
      <div id="redLog" class="event-log"></div>
    </div>

    <!-- 3D Scene -->
    <div id="sim">
      <!-- Overlays (inside sim for proper positioning) -->
      <div id="gameTitle">GALACTIC GREENHOUSE, 2026</div>
      <div id="gameWinnerMessage"></div>
      <div id="bonusCropDisplay"></div>
      <div id="redBonusMessage" class="bonus-message">Bonus crop harvested! +50%</div>
      <div id="blueBonusMessage" class="bonus-message">Bonus crop harvested! +50%</div>
      <div id="actionMessage"></div>
      <div id="gameTimer">TIME: 0s</div>
      <div id="redResourcePanel">
        <div class="resource-badge">
          <span class="label" id="redWaterLabel">RED Water:</span>
          <span class="value" id="redWaterVal">6</span>
        </div>
      </div>
      <div id="blueResourcePanel">
        <div class="resource-badge">
          <span class="label" id="blueWaterLabel">BLUE Water:</span>
          <span class="value" id="blueWaterVal">6</span>
        </div>
      </div>
      <canvas id="scene"></canvas>
      <div id="cropLegend">
        <span class="crop-item"><span class="emoji">🍅</span> Tomato 6s/6pt</span>
        <span class="crop-item"><span class="emoji">🥬</span> Cabbage 8s/7pt</span>
        <span class="crop-item"><span class="emoji">🍓</span> Strawberry 5s/5pt</span>
        <span class="crop-item"><span class="emoji">🍈</span> Melon 12s/11pt</span>
        <span class="crop-item"><span class="emoji">🫐</span> Blueberry 3s/3pt</span>
        <span class="crop-item"><span class="emoji">🥔</span> Potato 9s/8pt</span>
      </div>
      <!-- Score Panels -->
      <div id="redScorePanel" class="score-panel red">
        <h3 id="redScoreHeader">RED</h3>
        <div class="score-total red"><span class="label">SCORE</span><span id="rTotal">0.0</span></div>
      </div>
      <div id="blueScorePanel" class="score-panel blue">
        <h3 id="blueScoreHeader">BLUE</h3>
        <div class="score-total blue"><span class="label">SCORE</span><span id="bTotal">0.0</span></div>
      </div>

      <div id="controls">
        <input type="file" id="simFile" accept=".txt,.json" style="display:none">
        <button onclick="document.getElementById('simFile').click()">Load Sim</button>
        <button onclick="setNames()">Set Names</button>
        <button onclick="playAnim()" id="btnPlay">Play</button>
        <button onclick="pauseAnim()" id="btnPause">Pause</button>
        <button onclick="resetAnim()">Reset</button>
        <select id="speedSelect" onchange="setSpeed(parseFloat(this.value))">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
          <option value="8">8x</option>
        </select>
        <input type="range" id="timeline" min="0" max="240" step="0.1" value="0">
        <span id="timeDisplay">0:00 / 4:00</span>
        <button onclick="toggleRecord()" id="btnRecord">Record</button>
        <button onclick="exportVideo()" id="btnExport">Export</button>
      </div>
    </div>

    <!-- Blue Event Log Panel -->
    <div id="blueCode">
      <div class="code-header blue" id="blueCodeHeader">BLUE ROBOT</div>
      <div id="blueLog" class="event-log"></div>
    </div>
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    // ========== CONFIGURATION ==========

    // ---- TEAM NAMES (edit these to customize) ----
    let RED_NAME  = 'RED';    // e.g. 'Alliance 1'
    let BLUE_NAME = 'BLUE';   // e.g. 'Alliance 2'

    // Apply team names to DOM elements
    function applyTeamNames() {
      document.getElementById('redCodeHeader').textContent = RED_NAME + ' ROBOT';
      document.getElementById('blueCodeHeader').textContent = BLUE_NAME + ' ROBOT';
      document.getElementById('redWaterLabel').textContent = RED_NAME + ' Water:';
      document.getElementById('blueWaterLabel').textContent = BLUE_NAME + ' Water:';
      document.getElementById('redScoreHeader').textContent = RED_NAME;
      document.getElementById('blueScoreHeader').textContent = BLUE_NAME;
    }
    applyTeamNames();

    function setNames() {
      const r = prompt('Red team name:', RED_NAME);
      if (r !== null && r.trim()) RED_NAME = r.trim();
      const b = prompt('Blue team name:', BLUE_NAME);
      if (b !== null && b.trim()) BLUE_NAME = b.trim();
      applyTeamNames();
      // Update zone labels
      redHome.children.forEach(c => { if (c.isCSS2DObject) c.element.textContent = RED_NAME + ' HOME'; });
      blueHome.children.forEach(c => { if (c.isCSS2DObject) c.element.textContent = BLUE_NAME + ' HOME'; });
    }

    // Coordinate mapping: game-z → visual-y (up), game-y → visual-z (depth)
    // So +z (red) faces upward, robots move in +z (forward) to reach plots
    const plotPositions = {
      redHome:      [0.0,  0.3,  0.0],    // red above (+y = game +z)
      blueHome:     [0.0, -0.3,  0.0],    // blue below (-y = game -z)
      wateringZone: [0.0,  0.0,  0.0],    // origin
      astronaut:    [0.0,  0.0,  1.5],    // far forward in depth

      // Red plots (y > 0 = visually above) - hourglass in x-z plane
      redPlot1: [-0.35, 0.20, 0.6],   // Front-Left
      redPlot2: [ 0.35, 0.20, 0.6],   // Front-Right
      redPlot3: [-0.15, 0.30, 1.0],   // Middle-Left (highest)
      redPlot4: [-0.35, 0.25, 1.4],   // Back-Left
      redPlot5: [ 0.35, 0.25, 1.4],   // Back-Right
      redPlot6: [ 0.15, 0.30, 1.0],   // Middle-Right (highest)

      // Blue plots (y < 0 = visually below) - mirror of red
      bluePlot1: [-0.35, -0.20, 0.6],
      bluePlot2: [ 0.35, -0.20, 0.6],
      bluePlot3: [-0.15, -0.30, 1.0],
      bluePlot4: [-0.35, -0.25, 1.4],
      bluePlot5: [ 0.35, -0.25, 1.4],
      bluePlot6: [ 0.15, -0.30, 1.0],
    };

    // Crop data
    const cropData = {
      1: { name: 'Tomato',     emoji: '🍅', growTime: 6,  points: 6,  color: 0xff4444 },
      2: { name: 'Cabbage',    emoji: '🥬', growTime: 8,  points: 7,  color: 0x66cc66 },
      3: { name: 'Strawberry', emoji: '🍓', growTime: 5,  points: 5,  color: 0xff6688 },
      4: { name: 'Melon',      emoji: '🍈', growTime: 12, points: 11, color: 0x88cc44 },
      5: { name: 'Blueberry',  emoji: '🫐', growTime: 3,  points: 3,  color: 0x6644cc },
      6: { name: 'Potato',     emoji: '🥔', growTime: 9,  points: 8,  color: 0xcc9944 },
    };

    const DIMINISH_RATE = 0.75;

    // ========== SIMULATION DATA ==========
    let simData = null;
    let simLoaded = false;

    // Timeline state
    let currentTime = 0;
    let playing = false;
    let playbackSpeed = 1;
    let lastFrameTime = 0;
    let gameEndTime = 240;

    // Parsed events
    let redEvents = [];
    let blueEvents = [];
    let lastRedEventIndex = -1;
    let lastBlueEventIndex = -1;

    // Water tracking (from events)
    let redWater = 6, blueWater = 6;

    // ========== THREE.JS SETUP ==========
    const scene = new THREE.Scene();
    const simDiv = document.getElementById('sim');
    const canvas = document.getElementById('scene');

    const camera = new THREE.PerspectiveCamera(68, 1, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setClearColor(0x060612);
    renderer.setPixelRatio(window.devicePixelRatio);

    const labelRenderer = new THREE.CSS2DRenderer();
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    simDiv.appendChild(labelRenderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.rotateSpeed = 0.4;
    controls.zoomSpeed = 0.6;
    controls.minDistance = 0.5;
    controls.maxDistance = 5;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0x4466aa, 0.5);
    scene.add(ambientLight);
    const hemisphereLight = new THREE.HemisphereLight(0x6688cc, 0x223344, 0.4);
    scene.add(hemisphereLight);
    const mainLight = new THREE.DirectionalLight(0xffffff, 0.9);
    mainLight.position.set(1, 3, 2);
    scene.add(mainLight);
    const fillLight = new THREE.DirectionalLight(0x88aaff, 0.3);
    fillLight.position.set(-2, 1, -1);
    scene.add(fillLight);

    // Starfield
    const starGeo = new THREE.BufferGeometry();
    const starCount = 800;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) {
      starPositions[i] = (Math.random() - 0.5) * 8;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));

    // ========== PARTICLE SYSTEM ==========
    const particles = [];

    function spawnParticles(pos, color, count, speed, life, size) {
      for (let i = 0; i < count; i++) {
        const geo = new THREE.SphereGeometry(size || 0.008, 6, 6);
        const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(pos.x, pos.y, pos.z);
        scene.add(mesh);
        const vel = new THREE.Vector3(
          (Math.random() - 0.5) * speed,
          Math.random() * speed * 0.8,
          (Math.random() - 0.5) * speed
        );
        particles.push({ mesh, vel, life: life || 1.0, decay: (1.0 / (life || 1.0)) * 0.016 });
      }
    }

    function spawnRingEffect(pos, color, maxRadius) {
      const geo = new THREE.RingGeometry(0.01, 0.015, 32);
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
      const ring = new THREE.Mesh(geo, mat);
      ring.position.set(pos.x, pos.y + 0.02, pos.z);
      ring.rotation.x = -Math.PI / 2;
      scene.add(ring);
      particles.push({
        mesh: ring, vel: new THREE.Vector3(), life: 1.0, decay: 0.025,
        isRing: true, maxRadius: maxRadius || 0.15
      });
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= p.decay;
        if (p.life <= 0) {
          scene.remove(p.mesh);
          if (p.mesh.geometry) p.mesh.geometry.dispose();
          if (p.mesh.material) p.mesh.material.dispose();
          particles.splice(i, 1);
          continue;
        }
        if (p.isRing) {
          const scale = (1 - p.life) * p.maxRadius / 0.01;
          p.mesh.scale.set(scale, scale, scale);
          p.mesh.material.opacity = p.life * 0.6;
        } else {
          p.mesh.position.add(p.vel);
          p.vel.y -= 0.0001; // gravity
          p.mesh.material.opacity = p.life * 0.8;
          p.mesh.scale.setScalar(p.life);
        }
      }
    }

    // animateBonus removed - astronaut visits handled by triggerEventVisual

    // ========== SIMULATION LOADER ==========

    function parseDebugMessages(txt, time) {
      if (!txt || !txt.trim()) return [];
      const events = [];
      const msgs = txt.split(/<!DBG \d+>:\s*/);

      for (const msg of msgs) {
        const trimmed = msg.trim();
        if (!trimmed) continue;
        // Skip noisy/redundant messages
        if (/^Terminal Output|^Initializing|^Current Robot ID|^Current Time|^Current Robot loc|^Current Water|^Starting Home|^-+$|^=+$|^General seed|^Time left|^TIMELEFT|^BEFORE ASTRO|^AFTER ASTRO|^CURRENTBONUSINDEX|^ASTROBONUSCROP|^x\s|^planting one|^Task\[|^Crop\[|^Plots explored|^Total distance|^Total harvest|^Astronaut visits|^Bonus crops used|^Total wait|^Final score|^Game Statistics|^=== |^Harvest Score|^Movement Bonus|^Exploration Bonus|^Battery Bonus|^TOTAL SCORE|^============/i.test(trimmed)) continue;
        // Skip coordinate-only messages
        if (/^-?\d+\.?\d*\s*$/.test(trimmed)) continue;

        let type = 'info';
        let plotNum = null;
        let cropId = null;
        let displayText = trimmed.split('\n')[0].substring(0, 100);

        if (/Planting\s+(\w+)\s+\(crop\s+(\d+)\)\s+at\s+plot\s+(\d+)/i.test(trimmed)) {
          type = 'plant'; cropId = parseInt(RegExp.$2); plotNum = parseInt(RegExp.$3);
          const crop = cropData[cropId];
          displayText = crop ? `Plant ${crop.emoji} ${crop.name} at plot ${plotNum}` : displayText;
        } else if (/Watered crop at plot\s+(\d+)/i.test(trimmed)) {
          type = 'water'; plotNum = parseInt(RegExp.$1);
          const m = trimmed.match(/Crop watered:\s+(\d+)/i);
          const times = m ? m[1] : '?';
          displayText = `Water plot ${plotNum} (${times}x)`;
        } else if (/Harvesting\s+(\w+)\s+at\s+plot\s+(\d+).*Actual=\+?([\d.]+)/i.test(trimmed)) {
          type = 'harvest'; plotNum = parseInt(RegExp.$2);
          const cropName = RegExp.$1; const pts = RegExp.$3;
          const m = trimmed.match(/crop\s+(\d+)/i);
          if (m) cropId = parseInt(m[1]);
          const crop = cropId ? cropData[cropId] : null;
          displayText = `Harvest ${crop ? crop.emoji : ''} ${cropName} plot ${plotNum} +${pts}pts`;
        } else if (/Harvesting\s+(\w+).*gives\s+\+(\d+)%\s+bonus/i.test(trimmed)) {
          type = 'harvest';
          displayText = `${RegExp.$1} bonus harvest! +${RegExp.$2}%`;
        } else if (/ASTRONAUT VISIT BONUS.*\+(\d+)/i.test(trimmed)) {
          type = 'astronaut';
          const m = trimmed.match(/Bonus crop #(\d+) of (\d+)/);
          displayText = m ? `Astronaut visit! +${RegExp.$1} pts (bonus ${m[1]}/${m[2]})` : 'Astronaut visit! +5 pts';
        } else if (/ASTRONAUT BONUS CROP ASSIGNMENT/i.test(trimmed)) {
          type = 'astronaut';
          displayText = trimmed.split('\n')[0].substring(0, 80);
        } else if (/BONUS CROP HARVESTED.*\+(\d+)/i.test(trimmed)) {
          type = 'harvest';
          displayText = `Bonus crop harvested! +${RegExp.$1} pts`;
        } else if (/ALL BONUS CROPS COMPLETED.*\+(\d+)/i.test(trimmed)) {
          type = 'astronaut';
          displayText = `All bonus crops done! +${RegExp.$1} pts`;
        } else if (/BONUS ADVANCED.*New bonus crop:\s+(\w+)/i.test(trimmed)) {
          type = 'astronaut';
          displayText = `New bonus crop: ${RegExp.$1}`;
        } else if (/Filled watering can/i.test(trimmed)) {
          type = 'fill';
          const m = trimmed.match(/with\s+(\d+)\s+units/i);
          displayText = m ? `Filled watering can (${m[1]} units)` : 'Filled watering can';
        } else if (/\[EXPLORATION\].*plot\s+(\d+).*\((\d+)\/(\d+)/i.test(trimmed)) {
          type = 'explore'; plotNum = parseInt(RegExp.$1);
          displayText = `First visit to plot ${plotNum}! (${RegExp.$2}/${RegExp.$3} explored)`;
        } else if (/Crop at plot\s+(\d+)\s+is now growing.*after\s+(\d+)/i.test(trimmed)) {
          type = 'water'; plotNum = parseInt(RegExp.$1);
          displayText = `Plot ${plotNum} growing (harvest in ${RegExp.$2}s)`;
        } else if (/Moving to plot\s+(\d+)/i.test(trimmed)) {
          type = 'move'; plotNum = parseInt(RegExp.$1);
          displayText = `Moving to plot ${plotNum}`;
        } else if (/Moving To Home/i.test(trimmed)) {
          type = 'move';
          displayText = 'Moving home';
        } else if (/Moved To Position/i.test(trimmed)) {
          continue; // Skip raw position confirmations
        } else if (/Moving to Position/i.test(trimmed)) {
          continue; // Skip raw position moves
        } else if (/Lost draw.*Not going to astronaut/i.test(trimmed)) {
          type = 'info';
          displayText = 'Lost draw! Denied astronaut access';
        } else if (/Both robots want.*astronaut.*random draw/i.test(trimmed)) {
          type = 'info';
          displayText = 'Astronaut contested! Random draw...';
        } else if (/Wait complete/i.test(trimmed)) {
          type = 'info';
          displayText = 'Wait complete';
        } else if (/Waiting for\s+([\d.]+)\s+seconds/i.test(trimmed)) {
          type = 'info';
          displayText = `Waiting ${RegExp.$1}s...`;
        } else if (/Waiting for Crop/i.test(trimmed)) {
          type = 'info';
          displayText = 'Waiting for crop to be ready';
        } else if (/Next bonus crop:\s+(\w+)/i.test(trimmed)) {
          type = 'astronaut';
          displayText = `Next bonus: ${RegExp.$1}`;
        } else if (/Visit astronaut again/i.test(trimmed)) {
          type = 'astronaut';
          displayText = 'Visit astronaut to confirm bonus!';
        } else if (/End of Game/i.test(trimmed)) {
          type = 'info';
          displayText = 'Game Over!';
        } else if (/Opponent|^Current bonus|^Next bonus mission|^All \d+ bonus|^Bonus harvests|^BONUS COMPLETION|^Error:/i.test(trimmed)) {
          continue; // Skip
        } else if (/Wait time|Growth time/i.test(trimmed)) {
          continue; // Skip growth time info
        } else if (/^\w+ \(crop \d+\): Growth/i.test(trimmed)) {
          continue; // Skip crop info lines
        } else {
          // Show unrecognized messages as info
          type = 'info';
        }

        events.push({ time, type, text: displayText, plotNum, cropId });
      }
      return events;
    }

    function loadSimulation(jsonText) {
      // Fix known typos in JSON (e.g. "-0.051g5" -> "-0.0515")
      const fixed = jsonText.replace(/(-?\d+\.?\d*)g(\d+)/g, '$1$2');
      simData = JSON.parse(fixed);

      // Parse events from txt messages
      redEvents = [];
      blueEvents = [];
      for (let i = 0; i < simData.tTxt.length; i++) {
        const time = parseFloat(simData.tTxt[i]);
        const rMsgs = parseDebugMessages(simData.satData[0].txt[i], time);
        const bMsgs = parseDebugMessages(simData.satData[1].txt[i], time);
        redEvents.push(...rMsgs);
        blueEvents.push(...bMsgs);
      }
      redEvents.sort((a, b) => a.time - b.time);
      blueEvents.sort((a, b) => a.time - b.time);

      // Determine game end time (when score data ends)
      const dF0 = simData.satData[0].dF[0];
      for (let i = dF0.length - 1; i >= 0; i--) {
        if (dF0[i] !== null) { gameEndTime = Math.min(i + 1, 240); break; }
      }

      // Reset and prepare
      currentTime = 0;
      lastRedEventIndex = -1;
      lastBlueEventIndex = -1;
      redWater = 6; blueWater = 6;
      document.getElementById('redLog').innerHTML = '';
      document.getElementById('blueLog').innerHTML = '';
      document.getElementById('gameWinnerMessage').style.display = 'none';
      document.getElementById('timeline').max = gameEndTime;

      // Reset plot visuals
      for (let i = 1; i <= 6; i++) {
        redPlots[i].material.color.set(0xff4466);
        redPlots[i].material.opacity = 0.35;
        redPlots[i].material.emissive = new THREE.Color(0x000000);
        const rcl = redPlots[i].getObjectByName('cropLabel');
        if (rcl) rcl.element.textContent = '';
        bluePlots[i].material.color.set(0x4488ff);
        bluePlots[i].material.opacity = 0.35;
        bluePlots[i].material.emissive = new THREE.Color(0x000000);
        const bcl = bluePlots[i].getObjectByName('cropLabel');
        if (bcl) bcl.element.textContent = '';
      }

      simLoaded = true;
      updateRobotPositions(0);
      updateScoreDisplay();
      console.log(`Simulation loaded: ${redEvents.length} red events, ${blueEvents.length} blue events, ${gameEndTime}s`);
    }

    // ========== POSITION INTERPOLATION ==========

    function getPosition(satIndex, t) {
      // st arrays have 1540 entries at 0.2s intervals
      const idx = t / 0.2;
      const i0 = Math.max(0, Math.min(Math.floor(idx), 1539));
      const i1 = Math.min(i0 + 1, 1539);
      const frac = idx - Math.floor(idx);
      const st = simData.satData[satIndex].st;

      // Game coords: st[0]=x, st[1]=y, st[2]=z
      // Visual coords: x=game_x, y=game_z (up), z=game_y (depth)
      const gx = st[0][i0] + (st[0][i1] - st[0][i0]) * frac;
      const gy = st[1][i0] + (st[1][i1] - st[1][i0]) * frac;
      const gz = st[2][i0] + (st[2][i1] - st[2][i0]) * frac;

      return { x: gx, y: gz, z: gy };
    }

    function updateRobotPositions(t) {
      if (!simData) return;
      const rp = getPosition(0, t);
      redRobot.position.set(rp.x, rp.y, rp.z);
      const bp = getPosition(1, t);
      blueRobot.position.set(bp.x, bp.y, bp.z);
    }

    // ========== EVENT PROCESSING ==========

    function triggerEventVisual(team, evt) {
      const tName = team === 'red' ? RED_NAME : BLUE_NAME;
      if (evt.type === 'plant' && evt.plotNum && evt.cropId) {
        animatePlant(team, evt.plotNum, evt.cropId);
      } else if (evt.type === 'water' && evt.plotNum) {
        animateWater(team, evt.plotNum);
        if (team === 'red') redWater = Math.max(0, redWater - 1);
        else blueWater = Math.max(0, blueWater - 1);
      } else if (evt.type === 'harvest' && evt.plotNum) {
        animateHarvest(team, evt.plotNum, evt.cropId || 1);
        showActionMessage(`${tName} harvests plot ${evt.plotNum}!`);
      } else if (evt.type === 'fill') {
        animateFill(team);
        if (team === 'red') redWater = 6; else blueWater = 6;
      } else if (evt.type === 'astronaut') {
        const robot = team === 'red' ? redRobot : blueRobot;
        highlightRobot(robot, 0xffd700);
        spawnParticles(
          new THREE.Vector3(robot.position.x, robot.position.y + 0.1, robot.position.z),
          0xffd700, 12, 0.012, 1.0, 0.007
        );
        showActionMessage(`${tName} visits astronaut! +5 pts`);
      } else if (evt.type === 'explore') {
        showActionMessage(`${tName} explores plot ${evt.plotNum}`);
      }
    }

    function processEventsUpTo(t) {
      while (lastRedEventIndex + 1 < redEvents.length && redEvents[lastRedEventIndex + 1].time <= t) {
        lastRedEventIndex++;
        const evt = redEvents[lastRedEventIndex];
        triggerEventVisual('red', evt);
        addLogEntry('redLog', evt);
      }
      while (lastBlueEventIndex + 1 < blueEvents.length && blueEvents[lastBlueEventIndex + 1].time <= t) {
        lastBlueEventIndex++;
        const evt = blueEvents[lastBlueEventIndex];
        triggerEventVisual('blue', evt);
        addLogEntry('blueLog', evt);
      }
    }

    // Seek to a specific time (replay events from scratch)
    function seekTo(t) {
      // Reset event state
      lastRedEventIndex = -1;
      lastBlueEventIndex = -1;
      redWater = 6; blueWater = 6;
      document.getElementById('redLog').innerHTML = '';
      document.getElementById('blueLog').innerHTML = '';
      document.getElementById('gameWinnerMessage').style.display = 'none';

      // Reset plot visuals
      for (let i = 1; i <= 6; i++) {
        redPlots[i].material.color.set(0xff4466);
        redPlots[i].material.opacity = 0.35;
        redPlots[i].material.emissive = new THREE.Color(0x000000);
        const rcl = redPlots[i].getObjectByName('cropLabel');
        if (rcl) rcl.element.textContent = '';
        bluePlots[i].material.color.set(0x4488ff);
        bluePlots[i].material.opacity = 0.35;
        bluePlots[i].material.emissive = new THREE.Color(0x000000);
        const bcl = bluePlots[i].getObjectByName('cropLabel');
        if (bcl) bcl.element.textContent = '';
      }

      // Replay events silently up to target time (no visual effects, just log + state)
      while (lastRedEventIndex + 1 < redEvents.length && redEvents[lastRedEventIndex + 1].time <= t) {
        lastRedEventIndex++;
        const evt = redEvents[lastRedEventIndex];
        addLogEntry('redLog', evt);
        // Track water state
        if (evt.type === 'water') redWater = Math.max(0, redWater - 1);
        else if (evt.type === 'fill') redWater = 6;
        // Track crop labels
        if (evt.type === 'plant' && evt.plotNum && evt.cropId) {
          const plot = getPlotByNumber('red', evt.plotNum);
          const crop = cropData[evt.cropId];
          if (plot && crop) {
            const cl = plot.getObjectByName('cropLabel');
            if (cl) cl.element.textContent = crop.emoji;
          }
        } else if (evt.type === 'harvest' && evt.plotNum) {
          const plot = getPlotByNumber('red', evt.plotNum);
          if (plot) {
            const cl = plot.getObjectByName('cropLabel');
            if (cl) cl.element.textContent = '';
          }
        }
      }
      while (lastBlueEventIndex + 1 < blueEvents.length && blueEvents[lastBlueEventIndex + 1].time <= t) {
        lastBlueEventIndex++;
        const evt = blueEvents[lastBlueEventIndex];
        addLogEntry('blueLog', evt);
        if (evt.type === 'water') blueWater = Math.max(0, blueWater - 1);
        else if (evt.type === 'fill') blueWater = 6;
        if (evt.type === 'plant' && evt.plotNum && evt.cropId) {
          const plot = getPlotByNumber('blue', evt.plotNum);
          const crop = cropData[evt.cropId];
          if (plot && crop) {
            const cl = plot.getObjectByName('cropLabel');
            if (cl) cl.element.textContent = crop.emoji;
          }
        } else if (evt.type === 'harvest' && evt.plotNum) {
          const plot = getPlotByNumber('blue', evt.plotNum);
          if (plot) {
            const cl = plot.getObjectByName('cropLabel');
            if (cl) cl.element.textContent = '';
          }
        }
      }

      currentTime = t;
      updateRobotPositions(t);
      updateScoreDisplay();
    }

    // ========== PLAYBACK CONTROLS ==========

    function playAnim() {
      if (!simLoaded) return;
      if (playing) return;
      playing = true;
      lastFrameTime = performance.now();
      document.getElementById('btnPlay').classList.add('active');
    }

    function pauseAnim() {
      playing = false;
      document.getElementById('btnPlay').classList.remove('active');
    }

    function resetAnim() {
      pauseAnim();
      if (!simLoaded) return;

      // Clear particles
      for (const p of particles) { scene.remove(p.mesh); }
      particles.length = 0;
      for (const t of trailParticles.red) scene.remove(t.mesh);
      for (const t of trailParticles.blue) scene.remove(t.mesh);
      trailParticles.red.length = 0;
      trailParticles.blue.length = 0;

      seekTo(0);
      document.getElementById('gameTimer').innerText = 'TIME: 0s';
      document.getElementById('timeline').value = 0;
      document.getElementById('timeDisplay').innerText = '0:00 / ' + formatTime(gameEndTime);
    }

    function setSpeed(val) {
      playbackSpeed = val;
    }

    // ========== VIDEO RECORDING (full-page compositing) ==========
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let recordCanvas = null;
    let recordCtx = null;

    function toggleRecord() {
      if (isRecording) stopRecording();
      else startRecording();
    }

    function initRecordCanvas() {
      recordCanvas = document.createElement('canvas');
      const dpr = window.devicePixelRatio || 1;
      recordCanvas.width = window.innerWidth * dpr;
      recordCanvas.height = window.innerHeight * dpr;
      recordCtx = recordCanvas.getContext('2d');
      recordCtx.scale(dpr, dpr);
    }

    function startRecording() {
      initRecordCanvas();
      const stream = recordCanvas.captureStream(60);
      const options = { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 16000000 };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) options.mimeType = 'video/webm';
      mediaRecorder = new MediaRecorder(stream, options);
      recordedChunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'galactic_greenhouse_replay.webm';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        recordedChunks = [];
      };
      mediaRecorder.start(100);
      isRecording = true;
      startBgTimer();
      document.getElementById('btnRecord').textContent = 'Stop Rec';
      document.getElementById('btnRecord').classList.add('recording');
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      isRecording = false;
      stopBgTimer();
      recordCanvas = null; recordCtx = null;
      document.getElementById('btnRecord').textContent = 'Record';
      document.getElementById('btnRecord').classList.remove('recording');
    }

    // Export: reset, record, and play through in real time
    function exportVideo() {
      if (!simLoaded) return;
      resetAnim();
      startRecording();
      setTimeout(playAnim, 300);
    }

    // --- Recording compositing helpers ---
    function rrect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
    }

    function drawRecLogEntries(ctx, logId, x, y, maxW, maxH) {
      const log = document.getElementById(logId);
      const entries = log.querySelectorAll('.log-entry');
      const lineH = 24;
      const maxEntries = Math.floor(maxH / lineH);
      const start = Math.max(0, entries.length - maxEntries);
      for (let i = start; i < entries.length; i++) {
        const entry = entries[i];
        const yPos = y + (i - start) * lineH;
        if (yPos > y + maxH) break;
        // Draw background for newest entry
        if (entry.classList.contains('newest')) {
          ctx.fillStyle = 'rgba(0, 255, 136, 0.08)';
          ctx.fillRect(x - 4, yPos - 14, maxW + 8, lineH);
          ctx.fillStyle = '#00ff88';
          ctx.fillRect(x - 4, yPos - 14, 2, lineH);
        }
        // Timestamp
        const timeSpan = entry.querySelector('.log-time');
        if (timeSpan) {
          ctx.fillStyle = 'rgba(180, 195, 230, 0.55)';
          ctx.font = '11px monospace';
          ctx.fillText(timeSpan.textContent, x, yPos);
        }
        // Event text — color by type
        if (entry.classList.contains('harvest') || entry.classList.contains('astronaut')) ctx.fillStyle = '#ffd700';
        else if (entry.classList.contains('plant') || entry.classList.contains('explore')) ctx.fillStyle = '#44ff88';
        else if (entry.classList.contains('water') || entry.classList.contains('fill')) ctx.fillStyle = '#44ccff';
        else if (entry.classList.contains('info')) ctx.fillStyle = '#bbaadd';
        else ctx.fillStyle = '#8899bb';
        ctx.font = '13px monospace';
        // Get just the event text (after timestamp)
        const fullText = entry.textContent;
        const timeText = timeSpan ? timeSpan.textContent : '';
        let eventText = fullText.substring(timeText.length);
        const textX = x + 42;
        const availW = maxW - 42;
        while (ctx.measureText(eventText).width > availW && eventText.length > 5) eventText = eventText.slice(0, -4) + '\u2026';
        ctx.fillText(eventText, textX, yPos);
      }
    }

    function drawRecScorePanel(ctx, x, y, name, score, color) {
      ctx.fillStyle = 'rgba(8, 14, 32, 0.92)';
      rrect(ctx, x, y, 200, 60, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(80, 120, 200, 0.2)';
      rrect(ctx, x, y, 200, 60, 10); ctx.stroke();
      ctx.fillStyle = color; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'left';
      ctx.fillText(name, x + 12, y + 22);
      ctx.strokeStyle = 'rgba(80, 120, 200, 0.2)';
      ctx.beginPath(); ctx.moveTo(x + 12, y + 30); ctx.lineTo(x + 188, y + 30); ctx.stroke();
      ctx.fillStyle = 'rgba(180, 195, 230, 0.55)'; ctx.font = '14px monospace';
      ctx.fillText('SCORE', x + 12, y + 50);
      ctx.fillStyle = color; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'right';
      ctx.fillText(score, x + 188, y + 50); ctx.textAlign = 'left';
    }

    function drawRecProjectedLabels(ctx, cx, cy, cw, ch) {
      const tmpVec = new THREE.Vector3();
      for (let n = 1; n <= 6; n++) {
        for (const p of [
          { mesh: redPlots[n], prefix: 'R', color: 'rgba(255,100,120,0.8)' },
          { mesh: bluePlots[n], prefix: 'B', color: 'rgba(80,140,255,0.8)' }
        ]) {
          p.mesh.getWorldPosition(tmpVec); tmpVec.project(camera);
          if (tmpVec.z > 1) continue;
          const sx = cx + (tmpVec.x * 0.5 + 0.5) * cw;
          const sy = cy + (-tmpVec.y * 0.5 + 0.5) * ch;
          ctx.font = '10px monospace'; ctx.textAlign = 'center';
          const lt = p.prefix + n, lw = ctx.measureText(lt).width + 10;
          ctx.fillStyle = 'rgba(6,6,18,0.7)'; ctx.fillRect(sx - lw / 2, sy - 26, lw, 15);
          ctx.fillStyle = p.color; ctx.fillText(lt, sx, sy - 14);
          const cl = p.mesh.getObjectByName('cropLabel');
          if (cl && cl.element.textContent) {
            ctx.font = '24px sans-serif'; ctx.fillText(cl.element.textContent, sx, sy - 34);
          }
        }
      }
      for (const z of [
        { obj: wateringZone, label: 'WATERING', color: 'rgba(0,204,255,0.9)' },
        { obj: astronautZone, label: 'ASTRONAUT', color: 'rgba(136,255,136,0.9)' },
        { obj: redHome, label: RED_NAME + ' HOME', color: 'rgba(255,68,102,0.9)' },
        { obj: blueHome, label: BLUE_NAME + ' HOME', color: 'rgba(68,136,255,0.9)' },
      ]) {
        z.obj.getWorldPosition(tmpVec); tmpVec.project(camera);
        if (tmpVec.z > 1) continue;
        const sx = cx + (tmpVec.x * 0.5 + 0.5) * cw;
        const sy = cy + (-tmpVec.y * 0.5 + 0.5) * ch;
        ctx.font = '10px monospace'; ctx.textAlign = 'center';
        const lw = ctx.measureText(z.label).width + 10;
        ctx.fillStyle = 'rgba(6,6,18,0.7)'; ctx.fillRect(sx - lw / 2, sy - 26, lw, 15);
        ctx.fillStyle = z.color; ctx.fillText(z.label, sx, sy - 14);
      }
      ctx.textAlign = 'left';
    }

      // Score panels

      // Crop legend

        ctx.fillStyle = 'rgba(8, 14, 32, 0.9)';
        rrect(ctx, centerX + centerW / 2 - mw / 2, 42, mw, 32, 8); ctx.fill();
        ctx.strokeStyle = 'rgba(80, 120, 200, 0.2)';
        rrect(ctx, centerX + centerW / 2 - mw / 2, 42, mw, 32, 8); ctx.stroke();
        ctx.fillStyle = '#d0d8f0'; ctx.fillText(mt, centerX + centerW / 2, 64);
      }
      // Bonus crop display
      const bonEl = document.getElementById('bonusCropDisplay');
      if (getComputedStyle(bonEl).display !== 'none' && parseFloat(getComputedStyle(bonEl).opacity) > 0.05) {
        ctx.font = 'bold 24px monospace';
        const bt = bonEl.innerText, bw = ctx.measureText(bt).width + 64;
        ctx.fillStyle = 'rgba(255, 215, 0, 0.2)';
        rrect(ctx, centerX + centerW / 2 - bw / 2, 74, bw, 44, 12); ctx.fill();
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)'; ctx.lineWidth = 2;
        rrect(ctx, centerX + centerW / 2 - bw / 2, 74, bw, 44, 12); ctx.stroke(); ctx.lineWidth = 1;
        ctx.fillStyle = '#ffd700'; ctx.fillText(bt, centerX + centerW / 2, 103);
      }
      // Winner message
      const winEl = document.getElementById('gameWinnerMessage');
      if (getComputedStyle(winEl).display !== 'none') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
        rrect(ctx, centerX + centerW / 2 - 200, canvasH / 2 - 55, 400, 110, 14); ctx.fill();
        ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 2;
        rrect(ctx, centerX + centerW / 2 - 200, canvasH / 2 - 55, 400, 110, 14); ctx.stroke(); ctx.lineWidth = 1;
        ctx.fillStyle = '#00ff88'; ctx.font = 'bold 32px monospace';
        const wl = winEl.innerText.trim().split('\n');
        ctx.fillText(wl[0] || '', centerX + centerW / 2, canvasH / 2 - 8);
        if (wl[1]) { ctx.font = '22px monospace'; ctx.fillText(wl[1], centerX + centerW / 2, canvasH / 2 + 28); }
      }
      ctx.textAlign = 'left';
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + sec.toString().padStart(2, '0');
    }

    // Timeline scrubbing
    document.getElementById('timeline').addEventListener('input', function() {
      if (!simLoaded) return;
      const t = parseFloat(this.value);
      const wasPlaying = playing;
      if (playing) pauseAnim();
      seekTo(t);
      document.getElementById('gameTimer').innerText = `TIME: ${Math.floor(t)}s`;
      document.getElementById('timeDisplay').innerText = formatTime(t) + ' / ' + formatTime(gameEndTime);
    });

    // File input handler
    document.getElementById('simFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          loadSimulation(ev.target.result);
        } catch (err) {
          console.error('Failed to load simulation:', err);
          alert('Failed to parse simulation file: ' + err.message);
        }
      };
      reader.readAsText(file);
    });

    // ========== RESIZE HANDLER ==========
    function onResize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (w === 0 || h === 0) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
      labelRenderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);

    // ========== BACKGROUND TIMER (keeps running when tab is hidden) ==========
    let bgWorker = null;

    function startBgTimer() {
      const blob = new Blob([
        'let t;onmessage=e=>{if(e.data==="go")t=setInterval(()=>postMessage(1),16);else{clearInterval(t);t=null}}'
      ], { type: 'text/javascript' });
      bgWorker = new Worker(URL.createObjectURL(blob));
      bgWorker.onmessage = () => {
        if (document.hidden && isRecording) updateFrame();
      };
      bgWorker.postMessage('go');
    }

    function stopBgTimer() {
      if (bgWorker) { bgWorker.postMessage('stop'); bgWorker.terminate(); bgWorker = null; }
    }

    // ========== MAIN ANIMATION LOOP ==========
    let trailTimer = 0;
    let zonePulseTime = 0;

    function updateFrame() {
      const now = performance.now();

      // Timeline-based playback
      if (playing && simLoaded) {
        const dt = (now - lastFrameTime) / 1000 * playbackSpeed;
        currentTime = Math.min(currentTime + dt, gameEndTime);

        updateRobotPositions(currentTime);
        processEventsUpTo(currentTime);
        updateScoreDisplay();

        // Update timer display
        document.getElementById('gameTimer').innerText = `TIME: ${Math.floor(currentTime)}s`;
        document.getElementById('timeline').value = currentTime;
        document.getElementById('timeDisplay').innerText = formatTime(currentTime) + ' / ' + formatTime(gameEndTime);

        // Check for game end
        if (currentTime >= gameEndTime) {
          pauseAnim();
          const rScore = getScore(0, currentTime);
          const bScore = getScore(1, currentTime);
          if (rScore > bScore) {
            showGameWinner(`${RED_NAME} WINS!<br><span style="font-size:0.7em">${rScore.toFixed(1)} &ndash; ${bScore.toFixed(1)}</span>`);
          } else if (bScore > rScore) {
            showGameWinner(`${BLUE_NAME} WINS!<br><span style="font-size:0.7em">${bScore.toFixed(1)} &ndash; ${rScore.toFixed(1)}</span>`);
          } else {
            showGameWinner(`TIE!<br><span style="font-size:0.7em">${rScore.toFixed(1)} &ndash; ${bScore.toFixed(1)}</span>`);
          }
          if (isRecording) {
            setTimeout(stopRecording, 2000);
          }
        }
      }
      lastFrameTime = now;

      // Zone pulsing
      zonePulseTime += 0.003;
      const pulse = 0.3 + Math.sin(zonePulseTime) * 0.15;
      wateringZone.material.opacity = pulse;
      astronautZone.material.opacity = pulse;

      // Trail particles
      trailTimer++;
      if (trailTimer % 4 === 0 && playing && simLoaded) {
        trailParticles.red.push(addTrailDot(redRobot, 0xff4466));
        trailParticles.blue.push(addTrailDot(blueRobot, 0x4488ff));
      }
      // Fade trails
      for (const arr of [trailParticles.red, trailParticles.blue]) {
        for (let i = arr.length - 1; i >= 0; i--) {
          arr[i].life -= 0.01;
          arr[i].mesh.material.opacity = arr[i].life * 0.3;
          if (arr[i].life <= 0) {
            scene.remove(arr[i].mesh);
            arr[i].mesh.geometry.dispose();
            arr[i].mesh.material.dispose();
            arr.splice(i, 1);
          }
        }
      }

      updateParticles();

      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);

      // Composite full-page frame for recording
      if (isRecording && recordCtx) compositeRecordFrame();
    }

    function animate() {
      requestAnimationFrame(animate);
      // When tab is hidden and recording, the Worker drives updateFrame instead
      if (document.hidden && isRecording) { controls.update(); return; }
      controls.update();
      updateFrame();
    }

    // Initial setup
    onResize();
    animate();

    // Auto-load default simulation file
    fetch('simulation_4260045.txt')
      .then(r => r.text())
      .then(text => {
        loadSimulation(text);
        setTimeout(playAnim, 800);
      })
      .catch(err => console.log('No default simulation file found, use Load Sim button'));
  </script>
</body>
</html>
